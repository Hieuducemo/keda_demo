apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keda-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - keda
  selector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  endpoints:
    - port: metrics   
      interval: 15s
